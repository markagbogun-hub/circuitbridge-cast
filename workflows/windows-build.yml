name: Build Castwise Audio Doctor

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm --clean --windowed --name CastwiseAudioDoctor --collect-all pyloudnorm --collect-all PySide6 --collect-all matplotlib --paths . -m castwise_audio_doctor
      - shell: pwsh
        run: Compress-Archive -Path dist/CastwiseAudioDoctor/* -DestinationPath CastwiseAudioDoctor-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CastwiseAudioDoctor-Windows
          path: CastwiseAudioDoctor-Windows.zip
